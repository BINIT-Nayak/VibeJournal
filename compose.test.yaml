name: vibejournal-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vibejournal_test
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: vibejournal_test
    ports:
      - "127.0.0.1:55433:5432"
    # Disposable test data; never shares a volume with development.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vibejournal_test", "-d", "vibejournal_test"]
      interval: 2s
      timeout: 3s
      retries: 20
